<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Noir Runner: 1930s Detective</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #d4af37;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5), 2px 2px 0 #000;
        }
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            text-align: left;
        }
        .screen {
            background: rgba(10, 10, 15, 0.85);
            padding: 40px;
            border: 2px solid #333;
            border-radius: 4px;
            pointer-events: auto;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }
        h1 {
            font-size: 48px;
            margin: 0 0 10px 0;
            letter-spacing: 4px;
            color: #ffaa55;
            text-transform: uppercase;
        }
        p {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn {
            background: transparent;
            color: #d4af37;
            border: 2px solid #d4af37;
            padding: 15px 40px;
            font-size: 20px;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #d4af37;
            color: #000;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
        }
        .hidden { display: none !important; }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="score-display" class="hidden">УЛИКИ: <span id="score-val">0</span></div>
        
        <div id="start-screen" class="screen">
            <h1>Нуарный Бег</h1>
            <p>Город хранит тайны. Собери улики, избегай мафии.<br>Управление: ← → (смена полосы), ↑ или Пробел (прыжок).</p>
            <button class="btn" id="start-btn">Начать расследование</button>
        </div>

        <div id="game-over-screen" class="screen hidden">
            <h1>Дело закрыто</h1>
            <p>Вы попали в засаду.<br>Собрано улик: <span id="final-score" style="color:#fff">0</span></p>
            <button class="btn" id="restart-btn">Новое расследование</button>
        </div>

        <div id="controls-hint" class="hidden">← → Смена полосы | ↑ Прыжок</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- КОНФИГУРАЦИЯ ИГРЫ ---
        const CONFIG = {
            laneWidth: 3.5,
            chunkLength: 30,
            baseSpeed: 0.25,
            maxSpeed: 0.6,
            gravity: -0.018,
            jumpForce: 0.38,
            fogColor: 0x111115,
            colors: {
                glass: 0x8899aa,
                paper: 0xdddddd,
                dirt: 0x3d2817
            }
        };

        // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ---
        let scene, camera, renderer;
        let player, playerVelocityY = 0, isJumping = false;
        let currentLane = 0; // -1, 0, 1
        let targetX = 0;
        let gameSpeed = CONFIG.baseSpeed;
        let score = 0;
        let isPlaying = false;
        let chunks = [];
        let particles = [];
        let lastChunkZ = 0;
        let animationId;

        // --- МАТЕРИАЛЫ (NUIR AESTHETIC) ---
        const materials = {
            wetAsphalt: new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.05, metalness: 0.9 }),
            brick: new THREE.MeshStandardMaterial({ color: 0x2a1a1a, roughness: 0.95 }),
            wood: new THREE.MeshStandardMaterial({ color: 0x3d2817, roughness: 0.9 }),
            metal: new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.95, roughness: 0.2 }),
            amberEmissive: new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff6600, emissiveIntensity: 3 }),
            redEmissive: new THREE.MeshStandardMaterial({ color: 0xaa0000, emissive: 0xff0000, emissiveIntensity: 2 }),
            goldClue: new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 1.0, roughness: 0.1, emissive: 0xffaa00, emissiveIntensity: 0.8 }),
            playerCoat: new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.8 }),
            playerHat: new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.9 })
        };

        // --- ИНИЦИАЛИЗАЦИЯ ---
        function init() {
            // Сцена
            scene = new THREE.Scene();
            scene.background = new THREE.Color(CONFIG.fogColor);
            scene.fog = new THREE.FogExp2(CONFIG.fogColor, 0.035);

            // Камера
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 4.5, 8);
            camera.lookAt(0, 1, -10);

            // Рендерер
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 0.7; // Мрачная, кинематографичная экспозиция
            document.body.appendChild(renderer.domElement);

            // Освещение
            setupLighting();

            // Игрок
            createPlayer();

            // События
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', handleInput);
            document.addEventListener('touchstart', handleTouch, { passive: false });
            
            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('restart-btn').addEventListener('click', resetGame);

            // Первый рендер
            renderer.render(scene, camera);
        }

        function setupLighting() {
            // Общий холодный свет (ночное небо)
            const hemiLight = new THREE.HemisphereLight(0x223344, 0x111111, 0.4);
            scene.add(hemiLight);

            // Тусклый заполняющий свет
            const ambientLight = new THREE.AmbientLight(0x111111, 0.6);
            scene.add(ambientLight);

            // Лунный свет (Directional)
            const moonLight = new THREE.DirectionalLight(0x8899cc, 0.6);
            moonLight.position.set(15, 25, -10);
            moonLight.castShadow = true;
            moonLight.shadow.mapSize.width = 1024;
            moonLight.shadow.mapSize.height = 1024;
            moonLight.shadow.camera.near = 0.5;
            moonLight.shadow.camera.far = 60;
            moonLight.shadow.camera.left = -20;
            moonLight.shadow.camera.right = 20;
            moonLight.shadow.camera.top = 20;
            moonLight.shadow.camera.bottom = -20;
            scene.add(moonLight);

            // Фонарь, следующий за игроком (теплый янтарный)
            const playerSpot = new THREE.SpotLight(0xffaa55, 3, 25, Math.PI / 5, 0.6, 1);
            playerSpot.position.set(0, 6, 4);
            playerSpot.target.position.set(0, 0, -8);
            playerSpot.castShadow = true;
            scene.add(playerSpot);
            scene.add(playerSpot.target);
            player.userData.spotlight = playerSpot;
            player.userData.spotTarget = playerSpot.target;
        }

        function createPlayer() {
            player = new THREE.Group();

            // Тело (плащ)
            const bodyGeo = new THREE.CylinderGeometry(0.25, 0.4, 1.6, 8);
            const body = new THREE.Mesh(bodyGeo, materials.playerCoat);
            body.position.y = 0.8;
            body.castShadow = true;
            player.add(body);

            // Шляпа (Федора)
            const brimGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.05, 16);
            const topGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.35, 16);
            const brim = new THREE.Mesh(brimGeo, materials.playerHat);
            brim.position.y = 1.5;
            const top = new THREE.Mesh(topGeo, materials.playerHat);
            top.position.y = 1.65;
            player.add(brim, top);

            scene.add(player);
        }

        // --- ГЕНЕРАЦИЯ МИРА ---
        function createChunk(zPos) {
            const chunk = new THREE.Group();
            chunk.position.z = zPos;

            // 1. Дорога (мокрый асфальт)
            const roadGeo = new THREE.PlaneGeometry(12, CONFIG.chunkLength);
            const road = new THREE.Mesh(roadGeo, materials.wetAsphalt);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            chunk.add(road);

            // 2. Разметка (трамвайные рельсы / линии)
            for (let i = 0; i < 4; i++) {
                const lineGeo = new THREE.PlaneGeometry(0.15, 3);
                const lineMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.8, roughness: 0.4 });
                
                const line1 = new THREE.Mesh(lineGeo, lineMat);
                line1.rotation.x = -Math.PI / 2;
                line1.position.set(-CONFIG.laneWidth / 2, 0.02, -CONFIG.chunkLength / 2 + i * 8);
                line1.receiveShadow = true;
                chunk.add(line1);

                const line2 = line1.clone();
                line2.position.set(CONFIG.laneWidth / 2, 0.02, -CONFIG.chunkLength / 2 + i * 8);
                chunk.add(line2);
            }

            // 3. Здания и декор по бокам
            const buildingHeight = 8 + Math.random() * 12;
            const buildGeo = new THREE.BoxGeometry(5, buildingHeight, CONFIG.chunkLength);
            
            const buildLeft = new THREE.Mesh(buildGeo, materials.brick);
            buildLeft.position.set(-8.5, buildingHeight / 2, 0);
            buildLeft.castShadow = true;
            buildLeft.receiveShadow = true;
            chunk.add(buildLeft);

            const buildRight = new THREE.Mesh(buildGeo, materials.brick);
            buildRight.position.set(8.5, buildingHeight / 2, 0);
            buildRight.castShadow = true;
            buildRight.receiveShadow = true;
            chunk.add(buildRight);

            // Неоновые вывески (случайно)
            if (Math.random() > 0.4) {
                const signGeo = new THREE.BoxGeometry(2.5, 0.6, 0.2);
                const signMat = Math.random() > 0.5 ? materials.amberEmissive : materials.redEmissive;
                const sign = new THREE.Mesh(signGeo, signMat);
                sign.position.set(Math.random() > 0.5 ? -6 : 6, 5 + Math.random() * 6, 2.6);
                chunk.add(sign);
            }

            // Уличные фонари
            const poleGeo = new THREE.CylinderGeometry(0.08, 0.12, 4.5);
            const pole = new THREE.Mesh(poleGeo, materials.metal);
            pole.position.set(5.2, 2.25, 0);
            pole.castShadow = true;
            chunk.add(pole);

            const lampGeo = new THREE.SphereGeometry(0.25, 8, 8);
            const lamp = new THREE.Mesh(lampGeo, materials.amberEmissive);
            lamp.position.set(5.2, 4.5, 0);
            chunk.add(lamp);

            const pointLight = new THREE.PointLight(0xffaa55, 1.5, 10);
            pointLight.position.set(5.2, 4.3, 0);
            chunk.add(pointLight);

            // 4. Объекты на дороге (Препятствия и Улики)
            // Гарантируем, что хотя бы одна полоса свободна
            const lanes = [-1, 0, 1].sort(() => Math.random() - 0.5);
            const obstacleLane = lanes[0];
            const itemLane = lanes[1]; // Монетка на другой полосе

            const obsX = obstacleLane * CONFIG.laneWidth;
            const obsType = Math.random();

            if (obsType < 0.5) {
                // Низкое препятствие (ящик / баррикада)
                const obsGeo = new THREE.BoxGeometry(2, 0.8, 1.5);
                const obs = new THREE.Mesh(obsGeo, materials.wood);
                obs.position.set(obsX, 0.4, 0);
                obs.castShadow = true;
                obs.receiveShadow = true;
                obs.userData = { type: 'obstacle_low', hit: false };
                chunk.add(obs);
            } else {
                // Высокое препятствие (стена / ретро-авто)
                const obsGeo = new THREE.BoxGeometry(2.2, 2.2, 4);
                const obs = new THREE.Mesh(obsGeo, materials.metal);
                obs.position.set(obsX, 1.1, 0);
                obs.castShadow = true;
                obs.receiveShadow = true;
                obs.userData = { type: 'obstacle_high', hit: false };
                chunk.add(obs);
            }

            // Улика (монета/портфель)
            const clueGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.1, 16);
            const clue = new THREE.Mesh(clueGeo, materials.goldClue);
            clue.rotation.x = Math.PI / 2;
            clue.position.set(itemLane * CONFIG.laneWidth, 1.2, 0);
            clue.userData = { type: 'clue', active: true, rotSpeed: 0.05 + Math.random() * 0.05 };
            chunk.add(clue);

            scene.add(chunk);
            chunks.push(chunk);
            return chunk;
        }

        function updateChunks() {
            // Генерация новых чанков впереди
            const frontEdge = player.position.z - CONFIG.chunkLength * 2;
            if (lastChunkZ > frontEdge) {
                lastChunkZ -= CONFIG.chunkLength;
                createChunk(lastChunkZ);
            }

            // Удаление старых чанков позади
            for (let i = chunks.length - 1; i >= 0; i--) {
                if (chunks[i].position.z > player.position.z + 15) {
                    scene.remove(chunks[i]);
                    // Очистка геометрии и материалов для предотвращения утечек памяти
                    chunks[i].traverse((child) => {
                        if (child.geometry) child.geometry.dispose();
                    });
                    chunks.splice(i, 1);
                }
            }
        }

        // --- ЧАСТИЦЫ (ВЗРЫВ ПРИ АВАРИИ) ---
        function spawnCrashParticles(position) {
            const count = 40;
            const colors = [CONFIG.colors.glass, CONFIG.colors.paper, CONFIG.colors.dirt];
            
            for (let i = 0; i < count; i++) {
                const size = 0.05 + Math.random() * 0.15;
                const geo = new THREE.BoxGeometry(size, size, size);
                const mat = new THREE.MeshBasicMaterial({ 
                    color: colors[Math.floor(Math.random() * colors.length)],
                    transparent: true,
                    opacity: 1.0
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(position);
                
                // Случайный разлет
                const velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.6,
                    Math.random() * 0.5 + 0.2,
                    (Math.random() - 0.5) * 0.6
                );

                particles.push({ mesh, velocity, life: 1.0, decay: 0.015 + Math.random() * 0.02 });
                scene.add(mesh);
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life -= p.decay;
                
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    p.mesh.geometry.dispose();
                    p.mesh.material.dispose();
                    particles.splice(i, 1);
                    continue;
                }

                p.velocity.y -= 0.015; // Гравитация частиц
                p.mesh.position.add(p.velocity);
                p.mesh.rotation.x += 0.1;
                p.mesh.rotation.y += 0.1;
                p.mesh.material.opacity = p.life;
            }
        }

        // --- ЛОГИКА ИГРЫ ---
        function handleInput(e) {
            if (!isPlaying) return;
            
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                currentLane = Math.max(-1, currentLane - 1);
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                currentLane = Math.min(1, currentLane + 1);
            } else if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') && !isJumping) {
                playerVelocityY = CONFIG.jumpForce;
                isJumping = true;
            }
            targetX = currentLane * CONFIG.laneWidth;
        }

        // Простая поддержка свайпов для мобильных
        let touchStartX = 0;
        let touchStartY = 0;
        function handleTouch(e) {
            if (!isPlaying) return;
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
            
            e.preventDefault(); // Предотвращаем скролл
        }
        
        window.addEventListener('touchend', (e) => {
            if (!isPlaying) return;
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                // Горизонтальный свайп
                if (Math.abs(diffX) > 30) {
                    if (diffX > 0) currentLane = Math.min(1, currentLane + 1);
                    else currentLane = Math.max(-1, currentLane - 1);
                    targetX = currentLane * CONFIG.laneWidth;
                }
            } else {
                // Вертикальный свайп (вверх)
                if (diffY < -30 && !isJumping) {
                    playerVelocityY = CONFIG.jumpForce;
                    isJumping = true;
                }
            }
        }, { passive: false });

        function checkCollisions() {
            const playerBox = new THREE.Box3().setFromObject(player);
            // Сужаем хитбокс игрока для более честной игры
            playerBox.expandByScalar(-0.15);

            for (const chunk of chunks) {
                for (const child of chunk.children) {
                    if (child.userData.type === 'obstacle_low' || child.userData.type === 'obstacle_high') {
                        if (child.userData.hit) continue;

                        const obsBox = new THREE.Box3().setFromObject(child);
                        if (playerBox.intersectsBox(obsBox)) {
                            // Если препятствие низкое и игрок высоко прыгает - он перепрыгивает
                            if (child.userData.type === 'obstacle_low' && player.position.y > 1.2) {
                                continue; // Успешный перепрыг
                            }
                            
                            // АВАРИЯ
                            child.userData.hit = true;
                            gameOver();
                            return;
                        }
                    } else if (child.userData.type === 'clue' && child.userData.active) {
                        const clueBox = new THREE.Box3().setFromObject(child);
                        if (playerBox.intersectsBox(clueBox)) {
                            child.userData.active = false;
                            child.visible = false;
                            score += 10;
                            document.getElementById('score-val').innerText = score;
                            
                            // Увеличение скорости со временем
                            gameSpeed = Math.min(CONFIG.maxSpeed, gameSpeed + 0.005);
                        }
                    }
                }
            }
        }

        function animate() {
            animationId = requestAnimationFrame(animate);

            if (!isPlaying) {
                // Медленное вращение камеры для меню
                camera.position.x = Math.sin(Date.now() * 0.0005) * 2;
                camera.lookAt(0, 1, -10);
                renderer.render(scene, camera);
                return;
            }

            // Движение игрока вперед
            player.position.z -= gameSpeed;

            // Плавная смена полосы (Lerp)
            player.position.x += (targetX - player.position.x) * 0.15;

            // Физика прыжка
            if (isJumping) {
                player.position.y += playerVelocityY;
                playerVelocityY += CONFIG.gravity;

                if (player.position.y <= 0) {
                    player.position.y = 0;
                    isJumping = false;
                    playerVelocityY = 0;
                }
            }

            // Анимация покачивания при беге
            if (!isJumping) {
                player.position.y = Math.abs(Math.sin(Date.now() * 0.015)) * 0.1;
            }

            // Камера следует за игроком
            camera.position.z = player.position.z + 9;
            camera.position.x += (player.position.x * 0.3 - camera.position.x) * 0.1; // Легкий наклон камеры
            
            // Фонарь следует за игроком
            if (player.userData.spotlight) {
                player.userData.spotlight.position.z = player.position.z + 4;
                player.userData.spotlight.position.x = player.position.x;
                player.userData.spotTarget.position.z = player.position.z - 8;
                player.userData.spotTarget.position.x = player.position.x;
            }

            // Вращение улик
            for (const chunk of chunks) {
                for (const child of chunk.children) {
                    if (child.userData.type === 'clue' && child.userData.active) {
                        child.rotation.z += child.userData.rotSpeed;
                    }
                }
            }

            updateChunks();
            checkCollisions();
            updateParticles();

            renderer.render(scene, camera);
        }

        // --- УПРАВЛЕНИЕ СОСТОЯНИЕМ ---
        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('score-display').classList.remove('hidden');
            document.getElementById('controls-hint').classList.remove('hidden');
            
            isPlaying = true;
            score = 0;
            gameSpeed = CONFIG.baseSpeed;
            currentLane = 0;
            targetX = 0;
            player.position.set(0, 0, 0);
            document.getElementById('score-val').innerText = score;

            // Очистка старых чанков
            chunks.forEach(c => scene.remove(c));
            chunks = [];
            lastChunkZ = 0;
            
            // Генерация стартовой зоны
            for (let i = 0; i < 4; i++) {
                createChunk(-i * CONFIG.chunkLength);
            }
        }

        function gameOver() {
            isPlaying = false;
            spawnCrashParticles(player.position.clone().add(new THREE.Vector3(0, 1, 0)));
            
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = score;
            document.getElementById('score-display').classList.add('hidden');
            document.getElementById('controls-hint').classList.add('hidden');
        }

        function resetGame() {
            // Очистка частиц
            particles.forEach(p => {
                scene.remove(p.mesh);
                p.mesh.geometry.dispose();
                p.mesh.material.dispose();
            });
            particles = [];
            
            document.getElementById('game-over-screen').classList.add('hidden');
            startGame();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Запуск
        init();
        animate();
    </script>
</body>
</html>
